<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Grades</title>

    <!-- External CSS link -->
    <link rel="stylesheet" href="CSS/styles.css">
</head>
<body>

    <!-- Outer Main Card Container --> 
    <div class="Card">

        <!-- Top Section -->
        <div class="section">
            <h1>List of Enrolled Students</h1>

            <table class="student-table">
                <thead>
                    <tr>
                        <th>Student Name</th>
                        <th>Grade</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>Anna Reyes</td>
                        <td>92</td>
                    </tr>
                    <tr>
                        <td>Ben Santos</td>
                        <td>85</td>
                    </tr>
                    <tr>
                        <td>Carla Cruz</td>
                        <td>78</td>
                    </tr>
                    <tr>
                        <td>David Lim</td>
                        <td>97</td>
                    </tr>
                    <tr>
                        <td>Ella Ramos</td>
                        <td>74</td>
                    </tr>
                </tbody>
            </table>

            <button class="button" onclick="showGradeEquivalent()">Show Grade Equivalent</button>
            <link button class="JS/script.js"></button>
        </div>

        <!-- Result Container -->
        <div id="result"></div>

    </div>

    <!-- External JS -->
    <script src="JS/script.js"></script>

</body>
</html>
